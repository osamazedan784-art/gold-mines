<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مناجم الذهب</title>
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">

<style id="css-base">
:root{--ink:#0e1726;--gold:#ffcf40;--gold2:#e8a317;--green:#34c46a;--panel:#162338;--bg:#0b1220;--text:#fff;--muted:#9fb3cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,sans-serif;direction:rtl}
body{overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px}
#app[hidden]{display:none}
.btn{border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;color:#2a1a00;padding:10px 16px;background:linear-gradient(#ffe27a,#f0b020 55%,#d9920f);box-shadow:0 3px 0 #8a5a00,0 5px 10px #0005;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 #8a5a00}
.btn:disabled{background:linear-gradient(#7a8398,#5f6a80);color:#d3dae8;box-shadow:0 3px 0 #3d4452;cursor:default}
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 30%,#1a2a4a,#070b14);display:flex;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;padding:20px;width:100%;max-width:400px}
#splash h1{font-size:32px;color:var(--gold);text-shadow:0 3px 0 #3a2200,0 0 20px #ffb02a99;margin:0 0 24px}
.splash-tip{font-size:14px;color:var(--muted);margin-bottom:16px;min-height:20px}
.splash-bar{height:10px;background:#000a;border-radius:6px;overflow:hidden;border:1px solid #ffd23f55}
.splash-bar i{display:block;height:100%;width:0;background:linear-gradient(#fff3a0,#e8a317);transition:width .3s ease;box-shadow:0 0 10px #ffd23f}
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-20px);background:linear-gradient(#1b2a44ee,#0e1726ee);border:1px solid #ffcf4099;color:var(--gold);padding:10px 18px;border-radius:14px;font-size:13px;font-weight:800;opacity:0;transition:opacity .4s,transform .4s;z-index:60;pointer-events:none;text-align:center;max-width:90vw;box-shadow:0 8px 24px #000a,0 0 18px #ffcf4033}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<style id="css-hud">
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(#1d2d49,#101b2d);border-bottom:2px solid #2d3f5f;box-shadow:0 6px 16px #0007}
#cash{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 2px 0 #0009,0 0 14px #ffcf4055}
#inc{font-size:12px;color:var(--muted);background:#0008;border:1px solid #ffffff14;padding:3px 10px;border-radius:20px;font-variant-numeric:tabular-nums}
</style>

<style id="css-world">
#world{position:relative;width:100%}
#sky{position:relative;height:190px;overflow:hidden;background:linear-gradient(#74c8f6,#b9e6fb 42%,#fff1d6 78%,#ffe3ba)}
#shaft{position:absolute;left:0;top:190px;width:64px;height:200px;background:linear-gradient(90deg,#070a10,#161e2c 50%,#070a10);border-left:4px solid #3a2a1b;border-right:4px solid #3a2a1b}
#rope{position:absolute;left:31px;top:60px;width:3px;height:100px;background:#c9cfdd;z-index:5}
#cab{position:absolute;left:12px;top:0;width:40px;height:50px;background:#d9801f;border:3px solid #8a4a0b;border-radius:6px;z-index:6;transition:transform .4s}
#rows{position:relative;margin-left:64px}
.row{height:70px;background:linear-gradient(#7a4a29,#6a3f22);border-bottom:3px solid #4a2b16;position:relative;overflow:hidden}
.row-info{padding:8px;color:#fff;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.row-bar{position:absolute;bottom:4px;left:8px;right:8px;height:6px;background:#000a;border-radius:3px;overflow:hidden}
.row-bar i{display:block;height:100%;background:linear-gradient(#fff3a0,#e8a317);width:0;transition:width .3s}
#nextMine{display:block;margin:12px;width:calc(100% - 24px);padding:14px;font-size:14px;border-radius:14px}
</style>

<style id="css-dock">
#dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#142138f2,#0d1626);border-top:2px solid #324666;border-radius:18px 18px 0 0;box-shadow:0 -8px 22px #000a;z-index:50;display:grid;grid-template-columns:1fr 1fr;gap:8px;direction:rtl}
#boostBtn{background:linear-gradient(#72eaa0,#2fb862 55%,#1f9a4d);box-shadow:0 3px 0 #1a6c3a;color:#fff;font-size:13px;padding:10px}
#boostBtn:disabled{background:linear-gradient(#7a8398,#5f6a80)}
</style>

</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <h1>⛏️ مناجم الذهب</h1>
    <div class="splash-tip" id="splashTip">جارٍ تحميل اللعبة…</div>
    <div class="splash-bar"><i id="splashBar"></i></div>
  </div>
</div>

<div id="app" hidden>
  <header id="hud">
    <div id="cash">🪙 0</div>
    <div id="inc">+0 / ثانية</div>
  </header>

  <main id="world">
    <div id="sky"></div>
    <div id="shaft"></div>
    <div id="rope"></div>
    <div id="cab"><b id="cabLoad"></b></div>
    <div id="rows"></div>
    <button id="nextMine" class="btn">فتح منجم جديد</button>
  </main>

  <nav id="dock">
    <button id="modeBtn" class="btn">×1</button>
    <button id="boostBtn" class="btn">⚡ تسريع</button>
  </nav>

  <div id="toast" role="status"></div>
</div>

<script id="js-all">
'use strict';

/* ============================================================
   1) الإعدادات والثوابت
   ============================================================ */
const CFG = {
  SAVE_KEY: 'goldmines.v5.save',
  MAX_MINES: 10,
  ROW_H: 70,
  WALK_T: 1.7,
  MINE_T: 1.2,
  ERA_NAMES: ['العصر الخشبي','العصر الحديدي','العصر الصناعي','العصر الكهربائي','العصر الذكي'],
  ERA_COLORS: ['#d9a441','#b8c4d0','#4ad0ff','#5fffff','#ff8cf0'],
  ECO: { K: [500,65,13.6,2.25,90], TD: [0,2,4,8,16] },
};

/* ============================================================
   2) دوال مساعدة
   ============================================================ */
const $ = (id) => document.getElementById(id);

const fmt = (n) => {
  n = Math.floor(n);
  if (!isFinite(n)) return n > 0 ? '∞' : '0';
  if (n < 1000) return '' + n;
  const u = ['K','M','B','T','Qa','Qi','Sx'];
  let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + u[i];
};

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const ease = (t) => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const rand = (a,b) => a + Math.random()*(b-a);

let toastTimer;
const toast = (msg) => {
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2800);
};

/* ============================================================
   3) الحالة والحفظ
   ============================================================ */
const S = {};

function newState() {
  const n = CFG.MAX_MINES;
  return {
    cash: 0, dm: 0,
    sh: Array.from({length: n}, () => ({lv:1, st:0})),
    el: 1, wh: 1, pile: 0,
    mode: 0,
    mm: {s:0, el:0, wh:0},
    boostEnd: 0, boostCd: 0,
    t: Date.now(),
    ev: {wh:0,el:0,tr:0,wk:0,ct:0},
    tu: {wh:1,el:1,tr:1,wk:1,ct:1},
    evb: 0,
    mx: Array(n).fill(0),
    ml: Array(n).fill(0),
    mg: Array(n).fill(0),
    res: [0,0,0],
    tot: 0, pt: 0,
    elCap: 0, whCap: 0,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    if (!raw) { Object.assign(S, newState()); return false; }
    const data = JSON.parse(raw);
    Object.assign(S, newState(), data);
    if (!Array.isArray(S.sh) || S.sh.length === 0) S.sh = [{lv:1,st:0}];
    S.sh.forEach(h => {
      if (!isFinite(h.lv) || h.lv < 1) h.lv = 1;
      if (!isFinite(h.st) || h.st < 0) h.st = 0;
    });
    if (!Array.isArray(S.mx)) S.mx = [];
    while (S.mx.length < S.sh.length) S.mx.push(0);
    return true;
  } catch (e) {
    console.warn('[load] failed', e);
    Object.assign(S, newState());
    return false;
  }
}

function saveState() {
  try {
    S.t = Date.now();
    localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(S));
  } catch (e) { console.warn('[save]', e); }
}

/* ============================================================
   4) اقتصاد اللعبة
   ============================================================ */
const mineType = (i) => i < 5 ? 0 : i < 8 ? 1 : 2;
const TYPE_MULT = [1, 1.4, 2.2];

function prodRate(i, lv) {
  const t = mineType(i);
  let b = 3 * lv * Math.pow(4.4, i);
  b *= 1 + (S.pr || 0) * 0.25;
  b *= S.mg[i] ? 2 + 0.2 * (S.ml[i] || 0) : 1;
  b *= TYPE_MULT[t];
  b *= 1 + (S.evb || 0);
  b *= Math.pow(1.5, S.mx[i] || 0);
  return b;
}

function upgradeCost(i, lv) {
  return 18 * Math.pow(5.2, i) * Math.pow(1.2, lv - 1);
}

function newMineCost(n) {
  return 150 * Math.pow(8.5, n);
}

function elCost(lv) {
  return 80 * Math.pow(1.3, lv - 1) * Math.pow(2.2, S.sh.length - 1);
}

function whCost(lv) {
  return 120 * Math.pow(1.3, lv - 1) * Math.pow(2.2, S.sh.length - 1);
}

function elCap(lv = S.el) {
  return 30 * Math.pow(1.3, lv - 1) * Math.pow(2, S.sh.length - 1);
}

function whCap(lv = S.wh) {
  return 50 * Math.pow(1.3, lv - 1) * Math.pow(2, S.sh.length - 1);
}

function totalRate() {
  let sum = 0;
  S.sh.forEach((h,i) => sum += prodRate(i,h.lv) / 5.2);
  const eRate = elCap() / (2 * (0.7 + 0.45 * S.sh.length) + 1.7);
  const wRate = whCap() / (1.35 + 2 * 1.35);
  return Math.min(sum, eRate, wRate);
}

function planBuy(costFn, lv, mode) {
  const n = mode === 0 ? 1 : mode === 1 ? 10 : 999;
  let k = 0, c = 0;
  while (k < n && k < 500) {
    const cost = costFn(lv + k);
    if (mode === 2 && c + cost > S.cash) break;
    c += cost; k++;
  }
  if (k === 0) { k = 1; c = costFn(lv); }
  return {k, c};
}

/* ============================================================
   5) محاكاة العمال
   ============================================================ */
const minerStates = [];
const rowRefs = [];

function initMiners() {
  S.sh.forEach((h, i) => {
    minerStates[i] = { p: 0, t: 0, u: 0 };
  });
}

function simulate(dt) {
  S.sh.forEach((h, i) => {
    const m = minerStates[i];
    if (!m) return;
    m.t += dt;

    if (m.p === 0) {
      // مشي نحو الصخر
      m.u = ease(Math.min(1, m.t / CFG.WALK_T));
      if (m.t >= CFG.WALK_T) { m.p = 1; m.t = 0; m.u = 1; }
    } else if (m.p === 1) {
      // حفر
      if (m.t >= CFG.MINE_T) {
        m.p = 2; m.t = 0;
        // إضافة الإنتاج للمخزون
        const amount = prodRate(i, h.lv);
        h.st += amount;
        S.res[mineType(i)] += amount;
      }
    } else if (m.p === 2) {
      // عودة
      m.u = 1 - ease(Math.min(1, m.t / CFG.WALK_T));
      if (m.t >= CFG.WALK_T) { m.p = 0; m.t = 0; m.u = 0; }
    }
  });

  // المصعد ينقل من المناجم للمستودع
  elevatorSim(dt);

  // الشاحنة تنقل من المستودع للذهب
  truckSim(dt);
}

const elevator = { y: 0, door: 0, load: 0, target: -1, phase: 'idle' };

function elevatorSim(dt) {
  // المصعد ينقل دورياً من المناجم
  if (elevator.phase === 'idle') {
    // ابحث عن منجم فيه مخزون
    let pick = -1;
    S.sh.forEach((h,i) => {
      if (h.st > 0.5 && (pick === -1 || h.st > S.sh[pick].st)) pick = i;
    });
    if (pick >= 0) {
      elevator.target = pick;
      elevator.phase = 'go';
      elevator.y = 0;
    }
  } else if (elevator.phase === 'go') {
    elevator.y = Math.min(elevator.target, elevator.y + dt * 6);
    if (elevator.y >= elevator.target) {
      elevator.phase = 'load';
      elevator.load = 0;
    }
  } else if (elevator.phase === 'load') {
    const h = S.sh[elevator.target];
    const take = Math.min(h.st, elCap(), elCap() - elevator.load, dt * elCap() * 3);
    h.st -= take;
    elevator.load += take;
    if (elevator.load >= elCap() || h.st < 0.1) {
      elevator.phase = 'up';
    }
  } else if (elevator.phase === 'up') {
    elevator.y = Math.max(0, elevator.y - dt * 6);
    if (elevator.y <= 0) {
      // تفريغ في المستودع
      S.pile += elevator.load;
      elevator.load = 0;
      elevator.phase = 'idle';
    }
  }
}

const truck = { t: 0, load: 0, phase: 'wait' };

function truckSim(dt) {
  if (truck.phase === 'wait') {
    if (S.pile >= 1) {
      truck.load = Math.min(S.pile, whCap());
      S.pile -= truck.load;
      truck.phase = 'go';
      truck.t = 0;
    }
  } else if (truck.phase === 'go') {
    truck.t += dt;
    if (truck.t >= 1.35) {
      // بيع
      S.cash += truck.load;
      S.tot += truck.load;
      truck.load = 0;
      truck.phase = 'wait';
    }
  }
}

/* ============================================================
   6) الرسم
   ============================================================ */
function buildRows() {
  const rows = $('rows');
  rows.innerHTML = '';
  rowRefs.length = 0;

  S.sh.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="row-info">منجم ${i+1} · مستوى ${h.lv}</div>
      <div class="row-bar"><i></i></div>
    `;
    rows.appendChild(row);
    rowRefs[i] = {
      info: row.querySelector('.row-info'),
      bar: row.querySelector('.row-bar i'),
    };
  });
}

let lastRowUpdate = 0;
function renderRows(now) {
  if (!now || now - lastRowUpdate < 200) return;
  lastRowUpdate = now;

  S.sh.forEach((h, i) => {
    const ref = rowRefs[i];
    if (!ref) return;
    // تحديث شريط المخزون
    const cap = elCap() * 3;
    const pct = Math.min(1, h.st / cap) * 100;
    ref.bar.style.width = pct + '%';
    // تحديث النص
    const newText = `منجم ${i+1} · مستوى ${h.lv} · 📦 ${fmt(h.st)}`;
    if (ref.info._last !== newText) {
      ref.info.textContent = newText;
      ref.info._last = newText;
    }
  });

  // تحديث المصعد
  const cab = $('cab');
  if (cab) {
    const y = elevator.y * 70 + (elevator.y === 0 ? 0 : 0);
    const scaleY = 1 + elevator.y * 0.02;
    cab.style.transform = `translateY(${y}px) scaleY(${scaleY})`;
    const loadText = elevator.load > 0 ? fmt(elevator.load) : '';
    const cl = $('cabLoad');
    if (cl && cl._last !== loadText) {
      cl.textContent = loadText;
      cl._last = loadText;
    }
  }
}

/* ============================================================
   7) حلقة اللعبة
   ============================================================ */
let lastTick = performance.now();
let lastRender = 0;

function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(0.1, (now - lastTick) / 1000);
  lastTick = now;

  simulate(dt);

  // تحديث HUD
  if (now - lastRender > 200) {
    lastRender = now;
    $('cash').textContent = `🪙 ${fmt(S.cash)}`;
    $('inc').textContent = `+${fmt(totalRate())} / ثانية`;
    renderRows(now);
    updateButtons();
  }
}

function updateButtons() {
  const btn = $('nextMine');
  if (S.sh.length >= CFG.MAX_MINES) {
    btn.textContent = 'وصلت للحد الأقصى';
    btn.disabled = true;
  } else {
    const cost = newMineCost(S.sh.length);
    const txt = `🔓 منجم ${S.sh.length+1} جديد · 🪙${fmt(cost)}`;
    if (btn._t !== txt) { btn.textContent = txt; btn._t = txt; }
    btn.disabled = S.cash < cost;
  }

  const boost = $('boostBtn');
  const n = Date.now();
  if (n < S.boostEnd) {
    const t = Math.ceil((S.boostEnd - n) / 1000);
    const txt = `⚡ يعمل · ${t}ث`;
    if (boost._t !== txt) { boost.textContent = txt; boost._t = txt; }
    boost.disabled = true;
  } else if (n < S.boostCd) {
    const t = Math.ceil((S.boostCd - n) / 1000);
    const txt = `⏳ ${t}ث`;
    if (boost._t !== txt) { boost.textContent = txt; boost._t = txt; }
    boost.disabled = true;
  } else {
    if (boost._t !== '⚡ تسريع ×2') {
      boost.textContent = '⚡ تسريع ×2';
      boost._t = '⚡ تسريع ×2';
    }
    boost.disabled = false;
  }
}

/* ============================================================
   8) الأحداث
   ============================================================ */
function setupEvents() {
  // زر منجم جديد
  $('nextMine').addEventListener('click', () => {
    if (S.sh.length >= CFG.MAX_MINES) return;
    const cost = newMineCost(S.sh.length);
    if (S.cash < cost) { toast(`تحتاج 🪙${fmt(cost - S.cash)} أخرى`); return; }
    S.cash -= cost;
    S.sh.push({lv:1, st:0});
    S.mx.push(0);
    S.ml.push(0);
    S.mg.push(0);
    minerStates.push({p:0, t:0, u:0});
    buildRows();
    toast(`🎉 منجم ${S.sh.length} مفتوح!`);
    saveState();
  });

  // زر الوضع
  $('modeBtn').addEventListener('click', () => {
    S.mode = (S.mode + 1) % 3;
    $('modeBtn').textContent = ['×1','×10','أقصى'][S.mode];
    S.mm = {s:S.mode, el:S.mode, wh:S.mode};
  });

  // زر التسريع
  $('boostBtn').addEventListener('click', () => {
    const n = Date.now();
    if (n < S.boostCd || n < S.boostEnd) return;
    S.boostEnd = n + 30000;
    S.boostCd = n + 90000;
    toast('⚡ تسريع ×2 لمدة 30 ثانية');
  });

  // حفظ عند مغادرة الصفحة
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) saveState();
  });
  window.addEventListener('pagehide', () => saveState());

  // حفظ دوري
  setInterval(() => saveState(), 4000);
}

/* ============================================================
   9) الإقلاع
   ============================================================ */
function boot() {
  console.log('[game] booting…');

  // تحديث شريط التحميل
  const bar = $('splashBar');
  const tip = $('splashTip');
  let progress = 0;
  const interval = setInterval(() => {
    progress += 20;
    if (bar) bar.style.width = Math.min(100, progress) + '%';
    if (progress >= 60 && tip) tip.textContent = 'جارٍ تجهيز المناجم…';
    if (progress >= 100) {
      clearInterval(interval);
      if (tip) tip.textContent = 'جاهز!';
    }
  }, 100);

  // تحميل الحالة
  const isNew = !loadState();
  console.log('[game] loaded. new:', isNew, 'cash:', S.cash, 'mines:', S.sh.length);

  // تهيئة العمال
  initMiners();

  // بناء الصفوف
  buildRows();

  // إعداد الأحداث
  setupEvents();

  // إخفاء شاشة البداية
  setTimeout(() => {
    const splash = $('splash');
    splash?.classList.add('out');
    $('app').hidden = false;
    setTimeout(() => splash?.remove(), 800);
  }, 1200);

  // بدء اللعبة
  requestAnimationFrame(gameLoop);

  console.log('[game] ready!');
}

/* ============================================================
   بدء
   ============================================================ */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
